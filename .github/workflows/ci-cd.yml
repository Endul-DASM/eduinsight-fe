name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Package standalone build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          tar -czf standalone.tgz -C .next/standalone .
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: standalone
          path: standalone.tgz
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-fe
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: standalone
      - run: mkdir standalone && tar -xzf standalone.tgz -C standalone

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Upload build
        run: rsync -az --delete standalone/ ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/opt/eduinsight/eduinsight-fe/

      - name: Restart
        run: ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} 'sudo systemctl restart eduinsight-fe'
